services:
  - type: web
    name: jingxu-feedback
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.feedback_service:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    disk:
      name: feedback-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: FEEDBACK_DB
        value: /var/data/feedback.sqlite3
      - key: FEEDBACK_ADMIN_KEY
        sync: false
